services:
  - type: web
    name: new-horizons-world
    env: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_PATH
        value: /var/render/data/app.db
      - key: KIMI_API_KEY
        sync: false
    disk:
      name: sqlite-data
      mountPath: /var/render/data
      sizeGB: 1
